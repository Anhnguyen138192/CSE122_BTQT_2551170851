
<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký CLB Lập trình Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-secondary">

  <div class="container py-4" style="max-width: 680px;">

    <!--nền trắng, bo góc-->
    <div class="card border-0 shadow-sm">

      <!-- Tiêu đề thẻ -->
      <!--chinh header nen xanh chữ trắng căn giữa -->
      <div class="card-header bg-success text-white text-center py-3">
        <h4 class="mb-0">Đăng ký tham gia CLB Lập trình Web</h4>
      </div>

      <div class="card-body p-4">
        <form action="#" method="post">
          <div class="row g-3">
            <!-- ô nhập: form-control-->
            <!-- Họ và tên -->
            <div class="col-md-6">
              <label for="hoTen" class="form-label">Họ và tên</label>

              <input type="text" class="form-control" id="hoTen" name="hoTen" placeholder="Nguyễn Văn A" required>
            </div>

            <!-- Mã sinh viên -->
            <div class="col-md-6">
              <label for="maSV" class="form-label">Mã sinh viên</label>
              <input type="text" class="form-control" id="maSV" name="maSV" placeholder="22xxxxxxx" required>
            </div>

            <!-- Email -->
            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="sv@tlu.edu.vn" required>
            </div>

            <!-- Số điện thoại -->
            <div class="col-md-6">
              <label for="sdt" class="form-label">Số điện thoại</label>
              <input type="tel" class="form-control" id="sdt" name="sdt" placeholder="09xxxxxxxx" pattern="0[0-9]{9}"
                title="Nhập 10 chữ số, bắt đầu bằng 0" required>
            </div>

            <!-- Trình độ -->
            <div class="col-12">
              <label class="form-label d-block">Trình độ</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="trinhDo" id="coBan" value="coban" checked required>
                <label class="form-check-label" for="coBan">Cơ bản</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="trinhDo" id="kha" value="kha">
                <label class="form-check-label" for="kha">Khá</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="trinhDo" id="tot" value="tot">
                <label class="form-check-label" for="tot">Tốt</label>
              </div>
            </div>
            <!-- ô Chọn lớp: form-select-->
            <!-- Chọn lớp -->
            <div class="col-12">
              <label for="lop" class="form-label">Chọn lớp</label>
              <select class="form-select" id="lop" name="lop" required>
                <option value="" disabled>-- Chọn lớp --</option>
                <option value="67CNTT1" selected>67CNTT1</option>
                <option value="67CNTT2">67CNTT2</option>
                <option value="67KTPM1">67KTPM1</option>
                <option value="67KTPM2">67KTPM2</option>
              </select>
            </div>

            <!-- Cam kết -->
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="camKet" checked required>
                <label class="form-check-label" for="camKet">
                  Tôi cam kết tự làm bài và quay video OBS
                </label>
              </div>
            </div>

            <!-- Nút -->
            <div class="col-12">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
                <button type="submit" class="btn btn-success px-4">Đăng ký</button>
              </div>
            </div>

          </div>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
