<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện ảnh — Hiệu ứng Hover</title>
  <link rel="stylesheet" href="style23.css">
</head>

<body>
  <!-- Phần tiêu đề của trang -->
  <header class="tieu-de">
    <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
    <p>Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
  </header>
  <main class="luoi">
    <figure class="o-anh">
      <img src="Anh/Bai23/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
      <figcaption>Vịnh Hạ Long</figcaption>
    </figure>

    <figure class="o-anh">
      <img src="Anh/Bai23/2-son-doong.jpg" alt="Hang Sơn Đoòng">
      <figcaption>Hang Sơn Đoòng</figcaption>
    </figure>

    <figure class="o-anh">
      <img src="Anh/Bai23/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
      <figcaption>Thác Bản Giốc</figcaption>
    </figure>

    <figure class="o-anh">
      <img src="Anh/Bai23/4-fansipan.jpg" alt="Fansipan">
      <figcaption>Fansipan</figcaption>
    </figure>

    <figure class="o-anh">
      <img src="Anh/Bai23/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
      <figcaption>Đồng bằng sông Cửu Long</figcaption>
    </figure>

    <figure class="o-anh">
      <img src="Anh/Bai23/6-phong-nha.jpg" alt="Động Phong Nha">
      <figcaption>Động Phong Nha</figcaption>
    </figure>

  </main>
</body>
</html>
