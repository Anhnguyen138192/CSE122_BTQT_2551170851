<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In lịch</title>
    <link rel="stylesheet" href="style12.css">
</head>
<body>
    <div class="khung">

        <div class="o-lich">
            <div class="nam" id="nam">2026</div>
            <div class="thang" id="thang">Tháng 12</div>
            <div class="so-ngay" id="soNgay">24</div>
            <div class="thu" id="thu">Thứ hai</div>
        </div>

        <p class="loi-chao" id="loiChao">Chào buổi sáng!</p>

        <div class="form-nhap">
            <div class="o-nhap">
                <label for="inNgay">Ngày</label>
                <input type="number" id="inNgay" value="24" min="1" max="31">
            </div>
            <div class="o-nhap">
                <label for="inThang">Tháng</label>
                <input type="number" id="inThang" value="12" min="1" max="12">
            </div>
            <div class="o-nhap">
                <label for="inNam">Năm</label>
                <input type="number" id="inNam" value="2026" min="1" max="9999">
            </div>
            <button type="button" id="nutIn" class="nut-in">In lịch</button>
        </div>

    </div>

    <script src="script12.js"></script>
</body>
</html>
